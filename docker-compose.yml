name: meridian

# Real infrastructure + real microservices.
#   docker compose up -d --build
#
# Ports on your PC (all bound to 127.0.0.1, so nothing is exposed to the network, except the dashboard):
#   4000 gateway   4002 orders   4003 inventory   4004 payments   4005 ledger   4010 control
#   9092 kafka     6379 redis    5433 postgres    8081 kafka-ui (optional)
#   8080 dashboard (change with DASHBOARD_PORT in a .env file; on AWS use DASHBOARD_PORT=80)

x-service-env: &service-env
  KAFKA_BROKERS: kafka:19092
  REDIS_URL: redis://redis:6379

x-service: &service
  build: ./services
  image: meridian-services:dev
  restart: unless-stopped # a stopped service stays stopped (good for the chaos demo)

services:
  # ---------------------------------------------------------------- infrastructure
  kafka:
    restart: unless-stopped
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    ports:
      - "127.0.0.1:5433:5432" # 5433 on your PC so it does not clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the Kafka topics once, then exits.
  init:
    <<: *service
    command: ["node", "init/index.mjs"]
    restart: "no"
    environment:
      <<: *service-env
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- microservices
  gateway:
    <<: *service
    command: ["node", "gateway/index.mjs"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      <<: *service-env
      PORT: 4000
      ORDERS_URL: http://orders:4002
      RATE_LIMIT: 120
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  orders:
    <<: *service
    command: ["node", "orders/index.mjs"]
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      <<: *service-env
      PORT: 4002
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/orders
      RESERVE_TIMEOUT_MS: 5000
      PAY_TIMEOUT_MS: 6000
      BREAKER_THRESHOLD: 3
      BREAKER_COOLDOWN_MS: 10000
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory:
    <<: *service
    command: ["node", "inventory/index.mjs"]
    ports:
      - "127.0.0.1:4003:4003"
    environment:
      <<: *service-env
      PORT: 4003
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/inventory
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payments:
    <<: *service
    command: ["node", "payments/index.mjs"]
    ports:
      - "127.0.0.1:4004:4004"
    environment:
      <<: *service-env
      PORT: 4004
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/payments
      PAYMENT_DECLINE_RATE: 0.05
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ledger:
    <<: *service
    command: ["node", "ledger/index.mjs"]
    ports:
      - "127.0.0.1:4005:4005"
    environment:
      <<: *service-env
      PORT: 4005
      DATABASE_URL: postgres://meridian:meridian@postgres:5432/ledger
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The dashboard's backend: collects metrics, Kafka lag and Redis stats, and holds the chaos switches.
  control:
    <<: *service
    command: ["node", "control/index.mjs"]
    ports:
      - "127.0.0.1:4010:4010"
    environment:
      <<: *service-env
      PORT: 4010
      GATEWAY_URL: http://gateway:4000
      ORDERS_URL: http://orders:4002
      INVENTORY_URL: http://inventory:4003
      PAYMENTS_URL: http://payments:4004
      LEDGER_URL: http://ledger:4005
      PAYMENT_DECLINE_RATE: 0.05
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The dashboard (web UI). Reads everything from the control service.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: meridian-dashboard:dev
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:3000"
    environment:
      CONTROL_URL: http://control:4010
    depends_on:
      control:
        condition: service_started

  # ---------------------------------------------------------------- optional: see Kafka in a browser
  #   docker compose --profile ui up -d kafka-ui      then open http://localhost:8081
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["ui"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: meridian
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  redisdata:
  pgdata:
